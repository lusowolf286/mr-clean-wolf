<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clean Wolf">

<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<script src="../config.js"></script>
<script src="../vendor/supabase.js"></script>
<script src="../shared/supa.js"></script>
</head>
<body>
<title>Clean Wolf Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<script src="../vendor/jspdf.umd.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#121212; --bar:#1A1918; --surface:#1D1C1B; --surface2:#262422; --line:#33302D; --line2:#2A2725;
  --ink:#F3ECE3; --muted:#A99F94; --gold:#E9AC3C; --gold2:#F5C451; --copper:#F0BE90;
  --ruby:#6B0F1F; --ruby2:#9B1B30; --rubydeep:#420A14; --rubytint:#34080F; --rubyink:#E3C9C4;
  --pos:#7CCB9F; --neg:#F28B7D;
  --display:"Syne","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button,input,select,label,a,textarea{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.n{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
[hidden]{display:none!important}

/* layout */
.app{min-height:100%}
.side{display:none}
.main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top-in{max-width:760px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.stripe{display:flex;flex-direction:column;gap:3px}
.stripe i{display:block;height:4px;background:var(--ruby)}
.stripe b{display:block;height:1px;background:var(--gold)}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand img{width:44px;height:38px;object-fit:contain}
.wm{display:flex;flex-direction:column;line-height:1}
.wm small{font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.3em;color:var(--gold)}
.wm span{font-family:var(--display);font-weight:800;font-size:17px}
.yr{appearance:none;-webkit-appearance:none;border:1px solid #3A3632;background:var(--surface);border-radius:999px;min-height:44px;padding:0 32px 0 16px;font-weight:600;font-variant-numeric:tabular-nums;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.dot{width:8px;height:8px;border-radius:50%;background:#555}.dot.on{background:var(--pos)}.dot.off{background:var(--neg)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);border-top:3px solid var(--ruby);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{border:0;background:none;min-height:56px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.nav svg,.side svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--gold)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--ruby2);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:18px;border:1px solid var(--ruby2);background:var(--ruby);color:var(--gold2);box-shadow:0 8px 20px rgba(0,0,0,.5);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:236px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--bar);border-right:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) 12px 20px max(12px,env(safe-area-inset-left,0px))}
  .side .brand{padding:0 6px 12px;flex:none}
  .side .stripe{margin:0 -12px 12px}
  .side button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;text-align:left;position:relative}
  .side button[aria-current="page"]{background:var(--ruby);color:var(--ink)}
  .side .badge{position:static;margin-left:auto}
  .side .sp{flex:1}
  .top,.nav{display:none}
  .main{max-width:1180px;padding:calc(24px + env(safe-area-inset-top,0px)) 28px 110px}
  .fab{bottom:28px;right:28px}
}

/* type */
.ph{display:flex;align-items:flex-end;gap:12px;margin:18px 0 14px;flex-wrap:wrap}
.ph .t{flex:1;min-width:0}
h1.pg{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin-top:3px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.gold{color:var(--gold)}.copper{color:var(--copper)}.neg{color:var(--neg)}.pos{color:var(--pos)}
.yr-in{display:none}
@media (min-width:900px){.yr-in{display:block}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--rubydeep);border-color:var(--ruby)}
.kpi.hero .lbl,.kpi.hero .h{color:var(--rubyink)}
.kpi.hero .v{color:var(--copper)}
.grid2{display:grid;gap:12px;margin-top:12px}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chart svg{width:100%;height:auto;display:block}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.hb .bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--line2);overflow:hidden}
.hb .bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.list-g{display:grid;gap:9px}

/* rows */
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px}
.seg{display:inline-flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;min-height:40px;padding:0 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ruby);color:var(--ink)}
.grp{margin-top:16px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 6px;border-bottom:1px solid var(--line);gap:8px}
.grp-h .t{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.03em}
.grp-h .s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:58px;text-align:left;border:0;border-bottom:1px solid var(--line2);background:none;padding:10px 2px;cursor:pointer;color:var(--ink)}
.row:hover{background:var(--surface)}
.r-date{font-size:11.5px;color:var(--muted);line-height:1.15;font-variant-numeric:tabular-nums}
.r-date b{display:block;font-size:18px;font-weight:600;color:var(--ink)}
.r-title{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.r-title .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.r-sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
.r-amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.r-amt b{display:block;font-weight:600;font-size:15.5px}
.r-amt small{font-size:11.5px}
.chip{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid #3A3632;color:var(--muted);white-space:nowrap}
.cat{font-family:var(--display);font-weight:800;font-size:11px;width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;background:var(--ruby);color:var(--ink);flex:none}
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ag{background:#2B2413;color:var(--gold)}
.p-tr{background:#123024;color:var(--pos)}
.p-en{background:#262422;color:var(--muted)}
.p-fa{background:var(--rubytint);color:var(--copper);border:1px solid var(--ruby)}
.p-lo{background:#3B1E1A;color:var(--neg)}
.empty{padding:32px 8px;text-align:center;color:var(--muted)}

/* agenda */
.ag{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:8px}
.ag .hr{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ag .hr small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.ag .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{min-height:44px;border:1px solid #3A3632;background:var(--surface2);border-radius:12px;padding:0 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.pri{background:var(--ruby);border-color:var(--ruby2);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#141414}
.btn.dng{color:var(--neg)}
.btn.dng.sure{background:var(--neg);color:#141414;border-color:var(--neg)}
.btn:disabled{opacity:.5}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 12px);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{max-width:860px}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:92dvh}}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:3px solid var(--ruby)}
.sh-h h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;flex:1;min-width:0}
.x{border:0;background:var(--surface2);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:20px;line-height:1;color:var(--ink)}
.sh-b{overflow:auto;padding:16px 18px;display:grid;gap:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh-f .sp{flex:1}
body.lock{overflow:hidden;position:fixed;width:100%}
.fld{display:grid;gap:5px;min-width:0}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border:1px solid #3A3632;background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.fld textarea{min-height:90px;resize:vertical}
.fld select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:560px){.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.three>:nth-child(3){grid-column:1/-1}}
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cats button,.st button{min-height:44px;border:1px solid #3A3632;background:var(--surface2);border-radius:12px;font-family:var(--display);font-weight:800;cursor:pointer}
.cats button[aria-pressed="true"],.st button[aria-pressed="true"]{background:var(--ruby);border-color:var(--ruby2)}
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.st button{font-family:var(--body);font-weight:700;font-size:14px}
.svs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media(min-width:760px){.svs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sv{display:grid;grid-template-columns:1fr auto;grid-template-areas:"c p" "l l";gap:2px 6px;text-align:left;padding:9px 11px;min-height:54px;border:1px solid #3A3632;background:var(--surface2);border-radius:12px;cursor:pointer}
.sv .c{grid-area:c;font-size:10.5px;font-weight:700;color:var(--muted)}
.sv .p{grid-area:p;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sv .l{grid-area:l;font-size:14px;overflow-wrap:anywhere}
.sv[aria-pressed="true"]{background:var(--rubytint);border-color:var(--ruby2)}
.sv[aria-pressed="true"] .c,.sv[aria-pressed="true"] .p{color:var(--copper)}
.xl{display:grid;grid-template-columns:minmax(0,1fr) 100px 44px;gap:6px}
.xl input{min-height:46px;border:1px solid #3A3632;background:var(--surface2);border-radius:12px;padding:0 12px;min-width:0;width:100%}
.addl{min-height:46px;border-radius:12px;border:1px dashed #6B645D;background:transparent;color:var(--copper);font-weight:600;cursor:pointer}
.calc{background:#141414;border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.calc .a{text-align:right}
.calc .big{font-size:17px;font-weight:700}
.calc hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.note{font-size:12.5px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.cal button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
.cal button small{font-size:9.5px;font-weight:700;letter-spacing:.02em}
.cal button.off{background:transparent;color:#6D655D;border-style:dashed}
.cal button.x{background:#34080F;border-color:var(--ruby2);color:#E3C9C4}
.cal button.xo{border-color:var(--gold);color:var(--gold)}
.cal button.full{background:#2B2413;border-color:#5A4A22}
.cal button:disabled{opacity:.3;cursor:default}
.cal .pad{min-height:44px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--line);margin-right:5px;vertical-align:-2px}
.ped{border-color:var(--gold)!important}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--ruby2)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .del{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:8px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;cursor:pointer}
.photos label{aspect-ratio:1;border-radius:12px;border:1px dashed #6B645D;display:grid;place-items:center;color:var(--copper);font-weight:600;font-size:13px;text-align:center;cursor:pointer;padding:6px}
.diary{display:grid;gap:10px}
.dy{border:1px solid var(--line);border-radius:14px;padding:12px;background:#171615;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.dy .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dy .thumbs{display:flex;gap:6px;overflow-x:auto}
.dy .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.pt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
.pt table{border-collapse:collapse;font-size:13.5px;width:100%;min-width:600px;font-variant-numeric:tabular-nums}
.pt th,.pt td{padding:6px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
.pt th:first-child,.pt td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.pt thead th{font-family:var(--display);font-weight:800;font-size:12.5px}
.pt input{width:78px;min-height:40px;border:1px solid transparent;background:var(--surface2);border-radius:8px;padding:6px;text-align:right;font-variant-numeric:tabular-nums}
.pt input:focus{border-color:var(--copper)}
.pc{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 0;border-bottom:1px solid var(--line2)}
.pc input[type=checkbox]{width:22px;height:22px;accent-color:var(--ruby2);flex:none}
.pc .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pc .nm small{font-size:12px;color:var(--muted)}
.pc .v{font-weight:700;color:var(--copper);font-variant-numeric:tabular-nums}
.stk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.stk .t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.stk .acts{grid-row:1/4;grid-column:2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.menu button{min-height:72px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);display:flex;align-items:center;gap:12px;padding:0 16px;font-weight:600;font-size:15px;cursor:pointer;text-align:left;position:relative}
.menu svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu .badge{position:static;margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#141414;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.banner{background:var(--rubytint);border:1px solid var(--ruby);color:var(--rubyink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:14px}
@media (max-width:400px){.wm span{font-size:15px}h1.pg{font-size:24px}.kpi .v{font-size:19px}.row{grid-template-columns:38px minmax(0,1fr) auto;gap:8px}}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* ============ regras de serviço ============ */
const est = r => r.estado || "entregue";
const fatEst = r => (r.fatura && r.fatura.estado) || (r.orig ? "emitida" : (est(r)==="entregue" ? "por_emitir" : ""));
const extrasSum = r => (r.extras||[]).reduce((a,x)=>a+(+x.valor||0),0);
const CU = () => S.custos || { valorHora:10, consumiveis:0, margemAlvo:20, fatores:{}, produtos:{}, receitas:{}, descontos:{familia:.10, first:.15} };
const descRates = () => Object.assign({familia:.10, first:.15}, CU().descontos||{});
function prodUnit(id){ const p=CU().produtos[id]; if (!p || p.emUso===false) return 0; return (+p.usos||0)>0 ? (+p.preco||0)/(+p.usos) : 0; }
const pName = id => { const p=CU().produtos[id]; return p ? (p.generico||p.nome) : id; };
function recFactor(k,cat){ const cu=CU(), rc=cu.receitas[k]; if (!rc) return 1; return rc.fixo ? 1 : (+((cu.fatores||{})[cat])||1); }
function costLine(k,cat){
  const cu=CU(), rc=cu.receitas[k]; if (!rc) return {prod:0,horas:0};
  const f=recFactor(k,cat); let p=0; for (const x of rc.produtos||[]) p+=prodUnit(x.id)*(+x.q||1);
  return { prod:p*f, horas:(+rc.horas||0)*(cu.tempoPorCategoria?f:1) };
}
function recCost(sv,cat){
  const cu=CU(); let prod=0,horas=0;
  for (const k of sv||[]){ const c=costLine(k,cat||"C"); prod+=c.prod; horas+=c.horas; }
  const cons=(sv&&sv.length)?(+cu.consumiveis||0):0, mo=horas*(+cu.valorHora||0);
  return { prod:r2(prod), cons:r2(cons), custo:r2(prod+cons), horas:Math.round(horas*100)/100, mo:r2(mo) };
}
const resOf = r => { const c=recCost(r.sv,r.cat); return r2((+r.fat||0) - extrasSum(r) - c.custo - c.mo); };
function priorServices(cli, exceptId){ const t=(cli||"").trim().toLowerCase(); return list("servicos").filter(r=>r._id!==exceptId && (r.cli||"").trim().toLowerCase()===t).length; }
function clientByName(n){ const t=(n||"").trim().toLowerCase(); return list("clientes").find(c=>(c.nome||"").trim().toLowerCase()===t); }
const cliDesc = c => c ? (c.descTipo || (c.familia?"familia":"")) : "";
const DESC_LBL = {familia:"Família", first:"First customer"};
function defaultDesc(cli){ return cliDesc(clientByName(cli)); }
function descPctOf(tipo, manual){ const d=descRates(); return tipo==="familia"?d.familia : tipo==="first"?d.first : tipo==="manual"?(+manual||0) : 0; }
function calcServico(f){
  const tab=((S.cfg||{}).precos||{})[f.cat]||{};
  let soma=0; for (const k of f.sv) soma+=+(tab[k]||0);
  soma+=+f.extra||0;
  const pct=descPctOf(f.descTipo,f.descManual);
  const servTotal=soma*(1-pct), xs=(f.extras||[]).reduce((a,x)=>a+(+x.valor||0),0);
  const fatAuto=Math.round(servTotal)+r2(xs);
  const fat=f.fatManual!=null?f.fatManual:fatAuto;
  const c=recCost(f.sv,f.cat);
  return { soma:r2(soma), pct, total:r2(servTotal), xs:r2(xs), fatAuto, fat:r2(fat), custo:c.custo, prod:c.prod, cons:c.cons, horas:c.horas, mo:c.mo, margem:r2(soma-c.custo-c.mo), rl:r2(fat-xs-c.custo-c.mo) };
}

/* ============ stock estimado ============ */
function unitsPerUse(pid, k, cat, x){
  const P=CU().produtos, p=P[x.id]; if (!p) return 0;
  const f=recFactor(k,cat), q=(+x.q||1)*f;
  if (x.id===pid && !p.stockDe) return (+p.usos||0)>0 ? q/(+p.usos) : 0;
  if (p.stockDe===pid){ const parent=P[pid]; const uc=(+p.usos||0)>0?(+p.preco||0)/(+p.usos):0; return (+parent.preco||0)>0 ? uc*q/(+parent.preco) : 0; }
  return 0;
}
function stockEstimate(pid){
  const p=CU().produtos[pid]; if (!p || !p.contagem) return null;
  const since=p.contagem.data||"0000-00-00"; let used=0;
  for (const r of list("servicos")){
    if (est(r)!=="entregue" || !(r.d>since)) continue;
    for (const k of r.sv||[]){ const rc=CU().receitas[k]; if (!rc) continue; for (const x of rc.produtos||[]) used+=unitsPerUse(pid,k,r.cat||"C",x); }
  }
  const left=Math.max(0,(+p.contagem.unidades||0)-used);
  return { left, used, cars: Math.floor(left*(+p.usos||0)+1e-9) };
}

/* ============ base de dados ============ */
let q=Promise.resolve();
const enqueue = fn => { const p=q.then(fn); q=p.catch(()=>{}); return p; };
const bucketOf = (coll,rec) => coll==="clientes" ? "todos" : (rec.d||today()).slice(0,4);
function clean(rec){ const o={}; for (const [k,v] of Object.entries(rec)) if (!k.startsWith("_")) o[k]=v; return o; }
async function removeFrom(coll,bucket,id){ const ref=db.doc(coll+"/"+bucket); const s=await ref.get(); if (!s.exists) return; const d=JSON.parse(JSON.stringify(s.data())); if (!d.items||!(id in d.items)) return; delete d.items[id]; await ref.set(d); }
function putItem(coll,id,rec){
  const bucket=bucketOf(coll,rec), body=clean(rec);
  return enqueue(async()=>{
    const old=S[coll][id];
    if (old && old._b && old._b!==bucket) await removeFrom(coll,old._b,id);
    const ref=db.doc(coll+"/"+bucket), s=await ref.get();
    if (s.exists){
      const d=JSON.parse(JSON.stringify(s.data())); d.items=d.items||{}; d.items[id]=body; await ref.set(d);
    } else await ref.set({ano:bucket, items:{[id]:body}});
  });
}
function delItem(coll,id){ const old=S[coll][id]; if (!old) return Promise.resolve(); return enqueue(()=>removeFrom(coll,old._b,id)); }
function patchCustos(patch){ return enqueue(()=>db.doc("config/custos").update(patch)); }
function writeErr(e){
  console.error(e);
  if (e && e.code==="invalid_argument"){ readOnly=true; toast("Não tem permissão para gravar alterações."); }
  else if (e && e.code==="quota_exceeded") toast("A base de dados atingiu o limite de documentos.");
  else toast("Não foi possível gravar. Verifique a ligação e tente de novo.");
}

function subscribe(coll){

function yearSel(){ return `<select class="yr yr-in" data-yr aria-label="Ano">${yearOptions()}</select>`; }
function goto(tab){ ui.tab=tab; ui.q=""; try{localStorage.setItem("cw2.tab",tab);}catch(e){} render(); window.scrollTo(0,0); }

/* ============ render ============ */
function render(){
  renderNav();
  const m=$("#main");
  const ready = online===false || ["servicos","movimentos","compras","clientes","cfg","custos"].every(c=>loaded.has(c));
  const fabTabs={agenda:1,servicos:1,clientes:1,compras:1,banco:1,resumo:1};
  $("#fab").hidden = readOnly || online===false || !fabTabs[ui.tab];
  if (!ready){ m.innerHTML=`<div class="ph"><div class="t"><h1 class="pg">A carregar…</h1><div class="sub">A ler os seus registos.</div></div></div>`; return; }
  const V={resumo:vResumo,agenda:vAgenda,servicos:vServicos,faturas:vFaturas,clientes:vClientes,compras:vCompras,banco:vBanco,produtos:vProdutos,stock:vStock,custos:vCustos,precos:vPrecos,exportar:vExportar,mais:vMais};
  const off = online===false ? `<div class="banner">Sem ligação à base de dados. Verifique a internet e o ficheiro config.js.</div>` : "";
  const a=document.activeElement, key=a&&m.contains(a)?focusKey(a):null, pos=a&&a.selectionStart;
  m.innerHTML = off + (V[ui.tab]||vResumo)();
  queueAgSync();
  if (key){ const i=m.querySelector(key); if (i){ i.focus({preventScroll:true}); if (pos!=null&&i.id==="q") try{i.setSelectionRange(pos,pos);}catch(e){} } }
}
function focusKey(el){ if (el.id) return "#"+CSS.escape(el.id); for (const k of Object.keys(el.dataset||{})){ const at="data-"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase()); return `[${at}="${CSS.escape(el.dataset[k])}"]`; } return null; }
const header = (title, sub, extra="") => `<div class="ph"><div class="t"><h1 class="pg">${title}</h1>${sub?`<div class="sub">${sub}</div>`:""}</div>${extra}</div>`;
function matchQ(t){ const s=ui.q.trim().toLowerCase(); return !s || t.toLowerCase().includes(s); }
const searchBox = ph => `<div class="tools"><input class="search" id="q" type="search" placeholder="${ph}" value="${esc(ui.q)}" aria-label="Procurar"></div>`;
function grouped(rows,rowFn,sumFn){
  const g={}; for (const r of rows){ const k=(r.d||"").slice(0,7); (g[k]=g[k]||[]).push(r); }
  return Object.keys(g).sort().reverse().map(k=>{ const [y,mo]=k.split("-"); return `<section class="grp"><div class="grp-h"><span class="t">${MESES[+mo-1]||"Sem data"} ${y||""}</span><span class="s">${sumFn(g[k])}</span></div>${g[k].map(rowFn).join("")}</section>`; }).join("");
}
function saldoAte(conta,ate){ let s=0; for (const r of list("movimentos")) if ((r.conta||"Principal")===conta && (!ate||r.d<=ate)) s+=+r.val||0; return r2(s); }

/* ---------- Resumo ---------- */
function vResumo(){
  const svcAll=list("servicos"), svc=svcAll.filter(inYear).filter(r=>est(r)==="entregue"), comp=list("compras").filter(inYear);
  const fat=svc.reduce((a,r)=>a+(+r.fat||0),0);
  let horas=0,mo=0,custo=0,xs=0; for (const r of svc){ const c=recCost(r.sv,r.cat); horas+=c.horas; mo+=c.mo; custo+=c.custo; xs+=extrasSum(r); }
  const rl=fat-xs-custo-mo, eh=horas?(fat-xs-custo)/horas:0, vh=+CU().valorHora||0;
  const cp=comp.reduce((a,r)=>a+(+r.val||0),0), saldo=saldoAte("Principal", ui.year==="todos"?null:ui.year+"-12-31");
  const ticket=svc.length?fat/svc.length:0;
  // comparação mesmo período ano anterior
  let cmp="";
  if (ui.year!=="todos"){
    const lastD = ui.year===String(new Date().getFullYear()) ? today().slice(5) : "12-31";
    const py=String(+ui.year-1), prev=svcAll.filter(r=>(r.d||"").startsWith(py) && r.d.slice(5)<=lastD).reduce((a,r)=>a+(+r.fat||0),0);
    if (prev>0){ const d=(fat-prev)/prev*100; cmp=`<span class="h ${d>=0?"pos":"neg"}" style="color:${d>=0?"#9FE0BD":"#F6B3AA"}">${d>=0?"+":""}${nf0.format(d)} % vs ${eur0(prev)} (${py})</span>`; }
  }
  const up=svcAll.filter(r=>est(r)!=="entregue").sort((a,b)=>(a.d+(a.hora||"")).localeCompare(b.d+(b.hora||""))).slice(0,4);
  const pend=svcAll.filter(r=>fatEst(r)==="por_emitir");
  // gráfico
  let labels,A,B;

function analytics(svcAll){
  const done=svcAll.filter(r=>est(r)==="entregue");
  const ys=years().filter(y=>done.some(r=>r.d.startsWith(y))).sort();
  const per=ys.map(y=>{ const rs=done.filter(r=>r.d.startsWith(y)); let f=0,c=0,h=0,x=0; for (const r of rs){ const k=recCost(r.sv,r.cat); f+=+r.fat||0; c+=k.custo; h+=k.horas; x+=extrasSum(r); } return {y,n:rs.length,f,eh:h?(f-x-c)/h:0}; }).filter(p=>p.n);
  const mx=Math.max(1,...per.map(p=>p.f)), vh=+CU().valorHora||0;
  const from=addDays(today(),-365), last=done.filter(r=>r.d>=from);
  const mix={}; for (const r of last) for (const k of r.sv||[]) mix[k]=(mix[k]||0)+1;
  const mixE=Object.entries(mix).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const top={},vis={}; for (const r of last){ top[r.cli]=(top[r.cli]||0)+(+r.fat||0); vis[r.cli]=(vis[r.cli]||0)+1; }
  const topE=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const cnt={}, first={}; for (const r of [...done].sort((a,b)=>a.d.localeCompare(b.d))){ cnt[r.cli]=(cnt[r.cli]||0)+1; if (!first[r.cli]) first[r.cli]=r.d.slice(0,4); }
  const nCli=Object.keys(cnt).length, ret=Object.values(cnt).filter(v=>v>=2).length, novos=Object.values(first).filter(y=>y===String(new Date().getFullYear())).length;
  let dsc=0,dn=0; for (const r of last){ const pct=r.descPct||descPctOf(r.descTipo); if (pct>0 && r.soma){ dsc+=r.soma*pct; dn++; } }
  return `<div class="grid2 grid3">
    <section class="card"><div class="card-h"><span class="lbl">Evolução anual</span><span class="note">faturado · €/hora</span></div><div class="list-g">
      ${per.map(p=>`<div class="hb" style="grid-template-columns:44px minmax(0,1fr) 70px 50px"><span class="muted">${p.y}</span><span class="bar" style="grid-column:auto"><i style="width:${(p.f/mx*100).toFixed(1)}%"></i></span><span style="text-align:right">${eur0(p.f)}</span><span style="text-align:right" class="${p.eh<vh?"neg":""}">${nf2.format(p.eh)}</span></div>`).join("")}
    </div></section>
    <section class="card"><div class="card-h"><span class="lbl">Mix de serviços</span><span class="note">12 meses · ${last.length} visitas</span></div><div class="list-g">
      ${mixE.map(([k,n])=>`<div class="hb"><span>${esc(SVK[k]?SVK[k].l:k)}</span><span>${n}</span><span class="bar"><i style="width:${(n/Math.max(1,last.length)*100).toFixed(1)}%"></i></span></div>`).join("")||`<span class="note">Sem dados.</span>`}
    </div></section>
    <section class="card"><div class="card-h"><span class="lbl">Clientes</span><span class="note">12 meses</span></div>
      ${topE.map(([n,v])=>`<div class="hb" style="border-bottom:1px solid var(--line2);padding-bottom:5px"><span><b style="font-weight:600">${esc(n)}</b> <span class="muted">· ${vis[n]} ${vis[n]===1?"visita":"visitas"}</span></span><span class="copper">${eur0(v)}</span></div>`).join("")}
      <div class="kv" style="margin-top:4px"><span>Voltaram</span><span>${ret} de ${nCli} (${nCli?nf0.format(ret/nCli*100):0} %)</span><span>Novos este ano</span><span>${novos}</span><span>Descontos</span><span>${eur0(dsc)} em ${dn} serviços</span></div>
    </section>
  </div>`;
}
function barChart(labels,A,B){
  const W=560,H=190,pl=40,pr=8,pt=12,pb=24,n=labels.length,max=Math.max(1,...A,...B),step=niceStep(max/3),top=Math.ceil(max/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/top), bw=(W-pl-pr)/n, w=Math.max(3,Math.min(16,bw*.32));
  let g=""; for (let v=0; v<=top+1e-9; v+=step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#2A2725"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" fill="#A99F94" font-size="10.5" font-family="Manrope">${nf0.format(v)}</text>`;
  let b=""; labels.forEach((l,i)=>{ const cx=pl+bw*i+bw/2;
    b+=`<rect x="${cx-w-1}" y="${y(A[i])}" width="${w}" height="${Math.max(0,y(0)-y(A[i]))}" rx="3" fill="#E9AC3C"><title>${l}: faturado ${eur(A[i])}</title></rect>`;
    b+=`<rect x="${cx+1}" y="${y(B[i])}" width="${w}" height="${Math.max(0,y(0)-y(B[i]))}" rx="3" fill="#C7384F"><title>${l}: compras ${eur(B[i])}</title></rect>`;
    b+=`<text x="${cx}" y="${H-6}" text-anchor="middle" fill="#A99F94" font-size="10.5" font-family="Manrope">${l}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturado e compras">${g}${b}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))), f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

function descricaoFatura(r){

/* ============ calendário (.ics) ============ */
function icsDate(d,h){ return d.replace(/-/g,"")+"T"+(h||"09:00").replace(":","")+"00"; }
function ics(rows){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mr Clean Wolf//Agenda//PT","CALSCALE:GREGORIAN"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  for (const r of rows){
    const c=recCost(r.sv,r.cat), mins=Math.max(60,Math.round(c.horas*60)), st=new Date((r.d)+"T"+(r.hora||"09:00")+":00"); const en=new Date(st.getTime()+mins*60000);
    const endS=dstr(en).replace(/-/g,"")+"T"+pad(en.getHours())+pad(en.getMinutes())+"00";
    const e=s=>String(s||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
    L.push("BEGIN:VEVENT","UID:"+r._id+"@mrcleanwolf","DTSTAMP:"+stamp,"DTSTART:"+icsDate(r.d,r.hora),"DTEND:"+endS,
      "SUMMARY:"+e("Clean Wolf — "+r.cli+(r.cat?" (cat. "+r.cat+")":"")),
      "DESCRIPTION:"+e((r.sv||[]).map(k=>SVK[k]?SVK[k].l:k).join(", ")+(r.viatura||r.matricula?"\nViatura: "+[r.viatura,r.matricula].filter(Boolean).join(" "):"")+"\nValor: "+eur(r.fat)),
      "END:VEVENT");
  }
  L.push("END:VCALENDAR"); return L.join("\r\n");
}

  const s=Math.min(1,1600/Math.max(img.width,img.height)), cv=document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);

function editServico(id, preset){
  const ex=id?S.servicos[id]:null; preset=preset||{};
  const f = ex ? { d:ex.d, hora:ex.hora||"", estado:est(ex), cli:ex.cli, viatura:ex.viatura||"", matricula:ex.matricula||"", cat:ex.cat||"C", sv:[...(ex.sv||[])], extra:+ex.extra||0,
      extras:(ex.extras||[]).map(x=>({nome:x.nome,valor:x.valor})), descTipo:ex.descTipo||(ex.descPct?"manual":""), descManual:+ex.descPct||0, notas:ex.notas||"", fotos:[...(ex.fotos||[])], vis:ex.visivelCliente!==false, fatManual:null }
    : { d:preset.d||today(), hora:preset.hora||"09:00", estado:preset.estado||"agendado", cli:preset.cli||"", viatura:preset.viatura||"", matricula:preset.matricula||"", cat:"C", sv:preset.sv&&preset.sv.length?[...preset.sv]:["ext","int"], extra:0, extras:[], descTipo:defaultDesc(preset.cli||""), descManual:0, notas:preset.notas||"", fotos:[], vis:true, fatManual:null };
  if (ex && Math.round(+ex.total||0)+extrasSum(ex)!==(+ex.fat||0)) f.fatManual=+ex.fat||0;
  let dirty=!ex;
  const groups=[...new Set(SV.map(s=>s.g))], tab=()=>((S.cfg||{}).precos||{})[f.cat]||{};
  const svHtml=()=>groups.map(g=>`<div class="fld"><span class="lbl">${g}</span><div class="svs">${SV.filter(s=>s.g===g).map(s=>{ const p=tab()[s.k]; return `<button type="button" class="sv" data-sv="${s.k}" aria-pressed="${f.sv.includes(s.k)}"><span class="c">${esc(s.c)}</span><span class="p">${p?nf2.format(p):"—"}</span><span class="l">${esc(s.l)}</span></button>`; }).join("")}</div></div>`).join("");
  const xlHtml=()=>f.extras.map((x,i)=>`<div class="xl"><input data-xn="${i}" value="${esc(x.nome)}" placeholder="Produto (ex.: cerâmica de vidros)" aria-label="Produto à parte"><input data-xv="${i}" value="${fmtIn(x.valor)}" placeholder="Valor €" inputmode="decimal" style="text-align:right" aria-label="Valor"><button type="button" class="x" data-xdel="${i}" aria-label="Remover linha">×</button></div>`).join("");
  const phHtml=()=>f.fotos.map((p,i)=>`<figure>${photoImg(p,"Fotografia "+(i+1))}<button type="button" class="del" data-pdel="${i}" aria-label="Remover fotografia">×</button></figure>`).join("") + (assets?`<label>+ Fotografia<input type="file" id="f-photo" accept="image/*" multiple hidden></label>`:"");
  const hasPrev = ex && ex.orig;
  const body=`
    <div class="fld"><span class="lbl">Estado</span><div class="st" id="f-st">${ESTADOS.map(e=>`<button type="button" data-st="${e[0]}" aria-pressed="${f.estado===e[0]}">${e[1]}</button>`).join("")}</div></div>
    <div class="three"><label class="fld"><span class="lbl">Data</span><input type="date" id="f-d" value="${esc(f.d)}"></label><label class="fld"><span class="lbl">Hora</span><input type="time" id="f-h" value="${esc(f.hora)}"></label>
      <label class="fld"><span class="lbl">Cliente</span><input id="f-cli" list="dl-cli" value="${esc(f.cli)}" placeholder="Nome" autocomplete="off"></label></div>
    ${dlist("dl-cli",list("clientes").map(c=>c.nome))}
    <div class="two"><label class="fld"><span class="lbl">Viatura</span><input id="f-via" list="dl-via" value="${esc(f.viatura)}" placeholder="Marca e modelo"></label><label class="fld"><span class="lbl">Matrícula</span><input id="f-mat" value="${esc(f.matricula)}" placeholder="AA-00-AA" autocapitalize="characters"></label></div>
    ${dlist("dl-via",list("servicos").map(r=>r.viatura))}
    <div class="fld"><span class="lbl">Categoria do veículo</span><div class="cats" id="f-cat">${CATS.map(c=>`<button type="button" data-cat="${c}" aria-pressed="${f.cat===c}">${c}</button>`).join("")}</div></div>
    <div id="f-svs" style="display:grid;gap:12px">${svHtml()}</div>
    <div class="fld"><span class="lbl">Cerâmicas e produtos à parte</span><div id="f-xl" style="display:grid;gap:6px">${xlHtml()}</div><button type="button" class="addl" id="f-xadd">+ Adicionar produto</button><span class="note">Debitados ao cliente pelo custo, sem margem.</span></div>
    <div class="two"><label class="fld"><span class="lbl">Desconto</span><select id="f-dt"><option value="">Sem desconto</option><option value="familia">Família (${nf0.format(descRates().familia*100)} %)</option><option value="first">First customer (${nf0.format(descRates().first*100)} %)</option><option value="manual">Outro</option></select></label>
      <label class="fld" id="f-dm-w" ${f.descTipo==="manual"?"":"hidden"}><span class="lbl">Desconto %</span><input id="f-dm" inputmode="decimal" value="${fmtIn(r2(f.descManual*100))}"></label></div>
    ${f.extra?`<label class="fld"><span class="lbl">Ajuste € (folha antiga)</span><input id="f-extra" inputmode="decimal" value="${fmtIn(f.extra)}"></label>`:""}
    <div class="calc" id="f-calc"></div>
    <label class="fld"><span class="lbl">Valor faturado €</span><input id="f-fat" inputmode="decimal" placeholder="automático"></label>
    <label class="chk" style="order:0"><input type="checkbox" id="f-vis" ${f.vis?"checked":""}> Mostrar anotações e fotografias ao cliente</label>
    <label class="fld"><span class="lbl">Anotações</span><textarea id="f-notas" placeholder="Estado da viatura à chegada, danos, pedidos do cliente…">${esc(f.notas)}</textarea></label>
    <div class="fld"><span class="lbl">Fotografias</span><div class="photos" id="f-ph">${phHtml()}</div>${assets?"":`<span class="note">As fotografias ficam disponíveis quando a app está aberta com sessão iniciada.</span>`}</div>
    ${hasPrev?`<p class="note">Importado da folha (${esc(ex.orig)}).</p>`:""}`;
  const foot=`${delBtn(!!ex)}<span class="sp"></span><button class="btn" type="button" id="sh-pdf">Orçamento PDF</button><button class="btn" type="button" id="sh-ics">Calendário</button><button class="btn pri" type="button" id="sh-save">Guardar</button>`;
  openSheet(ex?"Serviço":"Novo serviço", body, foot, close=>{
    $("#f-dt").value=f.descTipo;
    const calcBox=$("#f-calc"), fatIn=$("#f-fat");
    const current=()=>{ if (dirty) return calcServico(f); const fat=f.fatManual!=null?f.fatManual:+ex.fat||0, k=recCost(f.sv,f.cat), xs=r2(f.extras.reduce((a,x)=>a+(+x.valor||0),0));
      return {soma:+ex.soma||0,pct:+ex.descPct||descPctOf(ex.descTipo),total:+ex.total||0,xs,fatAuto:Math.round(+ex.total||0)+xs,fat,custo:k.custo,prod:k.prod,cons:k.cons,horas:k.horas,mo:k.mo,margem:r2((+ex.soma||0)-k.custo-k.mo),rl:r2(fat-xs-k.custo-k.mo)}; };
    const paint=()=>{ const c=current(), vh=+CU().valorHora||0, ph=c.horas?(c.fat-c.xs-c.custo)/c.horas:0;
      calcBox.innerHTML=`<span class="muted">Serviços</span><span class="a muted">${eur(c.soma)}</span>
        ${c.pct>0?`<span class="muted">Desconto ${nf0.format(c.pct*100)} %</span><span class="a muted">−${nf2.format(c.soma-c.total)} €</span>`:""}
        ${c.xs?`<span class="muted">Produtos à parte</span><span class="a muted">+${nf2.format(c.xs)} €</span>`:""}
        <span class="big">Faturado</span><span class="a big">${eur(c.fat)}</span>
        <span class="muted">Produtos</span><span class="a muted">−${nf2.format(c.prod)} €</span>
        ${c.cons?`<span class="muted">Consumíveis</span><span class="a muted">−${nf2.format(c.cons)} €</span>`:""}
        <span class="muted">Mão de obra ${nf2.format(c.horas)} h × ${nf2.format(vh)} €</span><span class="a muted">−${nf2.format(c.mo)} €</span>
        <hr><span class="big ${c.rl<0?"neg":"gold"}">Resultado líquido</span><span class="a big ${c.rl<0?"neg":"gold"}">${eur(c.rl)}</span>
        <span class="note">Ganho por hora</span><span class="a note ${ph<vh?"neg":"pos"}">${nf2.format(ph)} €/h</span>`;
      fatIn.placeholder=eur(c.fatAuto)+" (automático)"; };
    if (f.fatManual!=null) fatIn.value=fmtIn(f.fatManual);
    const touch=()=>{ dirty=true; paint(); };
    $("#f-st").onclick=e=>{ const b=e.target.closest("[data-st]"); if(!b) return; f.estado=b.dataset.st; $("#f-st").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.st===f.estado)); };
    $("#f-cat").onclick=e=>{ const b=e.target.closest("[data-cat]"); if(!b) return; f.cat=b.dataset.cat; $("#f-cat").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat===f.cat)); $("#f-svs").innerHTML=svHtml(); touch(); };
    $("#f-svs").onclick=e=>{ const b=e.target.closest("[data-sv]"); if(!b) return; const k=b.dataset.sv, s=SVK[k];
      if (f.sv.includes(k)) f.sv=f.sv.filter(x=>x!==k); else { if (s.x) f.sv=f.sv.filter(x=>SVK[x].x!==s.x); f.sv.push(k); }
      $("#f-svs").querySelectorAll("[data-sv]").forEach(x=>x.setAttribute("aria-pressed",f.sv.includes(x.dataset.sv))); touch(); };
    const xl=$("#f-xl");
    $("#f-xadd").onclick=()=>{ f.extras.push({nome:"",valor:0}); xl.innerHTML=xlHtml(); const ins=xl.querySelectorAll("[data-xn]"); ins[ins.length-1].focus(); touch(); };
    xl.addEventListener("input",e=>{ const t=e.target; if (t.dataset.xn!=null) f.extras[+t.dataset.xn].nome=t.value; if (t.dataset.xv!=null){ f.extras[+t.dataset.xv].valor=numIn(t.value); touch(); } });
    xl.addEventListener("click",e=>{ const b=e.target.closest("[data-xdel]"); if(!b) return; f.extras.splice(+b.dataset.xdel,1); xl.innerHTML=xlHtml(); touch(); });
    $("#f-dt").onchange=e=>{ f.descTipo=e.target.value; $("#f-dm-w").hidden=f.descTipo!=="manual"; touch(); };
    $("#f-dm").oninput=e=>{ f.descManual=numIn(e.target.value)/100; touch(); };
    if ($("#f-extra")) $("#f-extra").oninput=e=>{ f.extra=numIn(e.target.value); touch(); };
    $("#f-cli").addEventListener("change",e=>{ if (!ex){ f.cli=e.target.value.trim(); f.descTipo=defaultDesc(f.cli); $("#f-dt").value=f.descTipo; $("#f-dm-w").hidden=f.descTipo!=="manual"; const last=list("servicos").filter(r=>r.cli===f.cli&&r.viatura).sort(byDateDesc)[0]; if (last){ if (!$("#f-via").value) $("#f-via").value=last.viatura; if (!$("#f-mat").value) $("#f-mat").value=last.matricula||""; if (last.cat){ f.cat=last.cat; $("#f-cat").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat===f.cat)); $("#f-svs").innerHTML=svHtml(); } } touch(); } });
    fatIn.oninput=e=>{ f.fatManual=e.target.value.trim()===""?null:numIn(e.target.value); paint(); };
    const ph=$("#f-ph");
    ph.addEventListener("click",e=>{ const b=e.target.closest("[data-pdel]"); if(!b) return; const [p]=f.fotos.splice(+b.dataset.pdel,1); ph.innerHTML=phHtml(); if (assets&&p&&p.id) assets.delete(p.id).catch(()=>{}); });
    ph.addEventListener("change",async e=>{ if (e.target.id!=="f-photo"||!assets) return; const files=[...e.target.files]; if (!files.length) return; toast("A carregar fotografias…");
      window.__photoFolder=(clientByName($("#f-cli").value)||{})._id||"geral";
      for (const file of files){ try { const blob=await shrink(file); const r=await assets.upload(blob,{type:"image/jpeg"}); f.fotos.push({id:r.id,url:r.url}); } catch(err){ console.error(err); toast("Uma fotografia não foi carregada."); } }
      ph.innerHTML=phHtml(); toast("Fotografias carregadas. Guarde o serviço."); });
    paint();
    const collect=()=>{ f.d=$("#f-d").value; f.hora=$("#f-h").value; f.cli=$("#f-cli").value.trim(); f.viatura=$("#f-via").value.trim(); f.matricula=$("#f-mat").value.trim().toUpperCase(); f.notas=$("#f-notas").value; f.vis=$("#f-vis").checked; };
    $("#sh-pdf").onclick=()=>{ collect(); orcamentoPDF(f, dirty?calcServico(f):current()); };
    $("#sh-ics").onclick=()=>{ collect(); const c=current(); save(`agendamento-${today()}.ics`, ics([Object.assign({_id:id||newId("t")},f,{fat:c.fat})])); };
    wireDelete(async()=>{ close(); try { await delItem("servicos",id); queuePortal(ex.cli); toast("Serviço apagado."); } catch(e){ writeErr(e); } });
    $("#sh-save").onclick=async()=>{
      collect();
      if (!f.d){ toast("Indique a data."); return; } if (!f.cli){ toast("Indique o cliente."); return; }
      if (!f.sv.length && !f.extras.length && !f.extra){ toast("Escolha pelo menos um serviço."); return; }
      const c=current(), extras=f.extras.filter(x=>x.nome||x.valor).map(x=>({nome:x.nome.trim(),valor:r2(x.valor)}));
      const rec=Object.assign({}, ex?clean(ex):{}, { d:f.d, hora:f.hora, estado:f.estado, cli:f.cli, viatura:f.viatura, matricula:f.matricula, cat:f.cat, sv:f.sv, extra:r2(f.extra), extras,
        descTipo:f.descTipo, descPct:r2(c.pct*10000)/10000, soma:c.soma, total:c.total, fat:r2(c.fat), notas:f.notas, fotos:f.fotos, visivelCliente:f.vis });
      if (!ex||!ex.orig){ rec.margem=c.margem; rec.rl=c.rl; rec.custo=c.custo; rec.horas=c.horas; }
      if (f.estado==="entregue" && !(rec.fatura&&rec.fatura.estado)) rec.fatura={estado:"por_emitir"};
      if (f.estado!=="entregue" && rec.fatura && rec.fatura.estado==="por_emitir") delete rec.fatura;
      const rid=id||newId("s"); close();
      try {
        await putItem("servicos",rid,rec); queuePortal(f.cli); if (ex && ex.cli!==f.cli) queuePortal(ex.cli);
        if (!clientByName(f.cli)){ const cod=Math.max(0,...list("clientes").map(x=>+x.cod||0))+1; await putItem("clientes",newId("k"),{cod,nome:f.cli,nif:"",email:"",tel:"",familia:false}); }
        if (!ex && preset.pedido && pedidosApi){ try { await pedidosApi.update(preset.pedido,{estado:"aceite",servico_id:rid}); PED=PED.filter(x=>x.id!==preset.pedido); schedule(); } catch(err){ console.error(err); toast("Serviço marcado, mas o pedido não foi atualizado."); return; } }
        toast(ex?"Serviço atualizado.":preset.pedido?"Pedido aceite e serviço marcado.":"Serviço marcado.");
      } catch(e){ writeErr(e); }
    };
  }, true);
}
async function setEstado(id, estado){
  const r=S.servicos[id]; if (!r) return;
  const rec=Object.assign(clean(r),{estado});
  if (estado==="entregue" && !(rec.fatura&&rec.fatura.estado)) rec.fatura={estado:"por_emitir"};
  try { await putItem("servicos",id,rec); queuePortal(r.cli); toast(estado==="entregue"?"Entregue. Passou para as faturas a emitir.":"Em tratamento."); } catch(e){ writeErr(e); }
}
function emitFatura(id){
  const r=S.servicos[id]; if (!r) return;
  const body=`<div class="kv"><span>Cliente</span><span>${esc(r.cli)}</span><span>Valor</span><span>${eur(r.fat)}</span></div>
    <label class="fld"><span class="lbl">N.º da fatura</span><input id="e-num" placeholder="Ex.: FT 2026/15"></label>
    <label class="fld"><span class="lbl">Data da fatura</span><input id="e-d" type="date" value="${today()}"></label>
    <label class="chk"><input type="checkbox" id="e-pago" checked> Pago</label>
    <label class="chk"><input type="checkbox" id="e-bank" checked> Lançar no banco como “Serviços”</label>`;
  openSheet("Marcar fatura emitida", body, `<span class="sp"></span><button class="btn" type="button" id="sh-cancel">Cancelar</button><button class="btn pri" type="button" id="sh-save">Confirmar</button>`, close=>{
    $("#sh-cancel").onclick=close;
    $("#sh-save").onclick=async()=>{ const num=$("#e-num").value.trim(), d=$("#e-d").value||today(), pago=$("#e-pago").checked, bank=$("#e-bank").checked; close();
      try { await putItem("servicos",id,Object.assign(clean(r),{fatura:{estado:"emitida",num,data:d},pago}));
        if (bank && pago) await putItem("movimentos",newId("b"),{d,desc:"Serviços",val:r2(r.fat),conta:"Principal",ord:Date.now(),ref:id});
        toast("Fatura registada."); } catch(e){ writeErr(e); } };
  });
}
async function copyFatura(id){
  const r=S.servicos[id], c=clientByName(r.cli)||{};
  const txt=`Cliente: ${r.cli}\nNIF: ${c.nif||""}\nData: ${fmtD(r.d)}\nDescrição: ${descricaoFatura(r)}\nValor: ${nf2.format(r.fat)} €`;
  try { await navigator.clipboard.writeText(txt); toast("Dados copiados. Cole no programa de faturação."); }
  catch(e){ openSheet("Dados para a fatura",`<textarea class="search" style="min-height:160px;padding:12px" readonly>${esc(txt)}</textarea>`,`<span class="sp"></span><button class="btn" type="button" id="sh-cancel">Fechar</button>`,close=>{ $("#sh-cancel").onclick=close; const t=$("#sh-form textarea"); t.focus(); t.select(); }); }
}

/* ---------- ficha de cliente ---------- */
function openCliente(cid){
  const c=S.clientes[cid]; if (!c) return;
  const svc=list("servicos").filter(r=>r.cli===c.nome).sort(byDateDesc);
  const fat=svc.reduce((a,r)=>a+(+r.fat||0),0), rl=svc.reduce((a,r)=>a+resOf(r),0);
  const vias=[...new Map(svc.filter(r=>r.viatura||r.matricula).map(r=>[(r.matricula||r.viatura),r])).values()];
  const body=`<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><span class="lbl">Serviços</span><span class="v">${svc.length}</span></div><div class="kpi"><span class="lbl">Faturado</span><span class="v">${eur0(fat)}</span></div><div class="kpi"><span class="lbl">Resultado</span><span class="v gold">${eur0(rl)}</span></div></div>
    <div class="kv"><span>NIF</span><span>${esc(c.nif||"—")}</span><span>Telefone</span><span>${esc(c.tel||"—")}</span><span>E-mail</span><span>${esc(c.email||"—")}</span><span>Desconto</span><span>${cliDesc(c)?DESC_LBL[cliDesc(c)]+" ("+nf0.format(descRates()[cliDesc(c)]*100)+" %)":"—"}</span>
    ${vias.length?`<span>Viaturas</span><span>${vias.map(r=>esc([r.viatura,r.matricula].filter(Boolean).join(" · "))).join("<br>")}</span>`:""}</div>
    <div class="card-h"><span class="lbl">Diário de serviços</span><button class="btn sm pri" type="button" id="c-new">+ Agendar</button></div>
    <div class="diary">${svc.map(r=>{ const e=est(r); return `<button type="button" class="dy" data-edit="servicos:${esc(r._id)}"><span class="h"><b>${fmtD(r.d)}</b>${r.hora?`<span class="muted">${esc(r.hora)}</span>`:""}<span class="pill ${EST[e][2]}">${EST[e][1]}</span><span class="muted">${esc([r.viatura,r.matricula].filter(Boolean).join(" · "))}</span><span style="margin-left:auto" class="n">${eur(r.fat)}</span></span>
      <span class="r-sub">${(r.sv||[]).map(k=>`<span class="chip">${esc(SVK[k]?SVK[k].l:k)}</span>`).join("")}${(r.extras||[]).map(x=>`<span class="chip">${esc(x.nome)}</span>`).join("")}</span>
      ${r.notas?`<span style="font-size:14px;white-space:pre-wrap">${esc(r.notas)}</span>`:""}
      ${(r.fotos||[]).length?`<span class="thumbs">${r.fotos.map(p=>photoImg(p,"")).join("")}</span>`:""}</button>`; }).join("")||`<div class="note">Ainda sem serviços.</div>`}</div>`;
  openSheet(c.nome, body, `<button class="btn" type="button" id="c-sms" title="Enviar por SMS o link de acesso à área de cliente">Enviar acesso por SMS</button><span class="sp"></span><button class="btn" type="button" id="c-edit">Editar dados</button><button class="btn" type="button" id="sh-cancel">Fechar</button>`, close=>{
    $("#sh-cancel").onclick=close; $("#c-edit").onclick=()=>{ close(); editCliente(cid); };
    $("#c-sms").onclick=()=>smsAcesso(c);
    $("#c-new").onclick=()=>{ close(); editServico(null,{cli:c.nome}); };
    $("#sh-form").addEventListener("click",e=>{ const b=e.target.closest("[data-edit]"); if (!b) return; close(); editServico(b.dataset.edit.split(":")[1]); });
  }, true);
}
function editCliente(id){
  const ex=id?S.clientes[id]:null, cod=ex?ex.cod:Math.max(0,...list("clientes").map(x=>+x.cod||0))+1;
  const body=`<div class="two"><label class="fld"><span class="lbl">Código</span><input id="k-cod" inputmode="numeric" value="${esc(cod)}"></label><label class="fld"><span class="lbl">NIF</span><input id="k-nif" inputmode="numeric" value="${esc(ex?ex.nif:"")}"></label></div>
    <label class="fld"><span class="lbl">Nome</span><input id="k-nome" value="${esc(ex?ex.nome:"")}"></label>
    <div class="two"><label class="fld"><span class="lbl">Telefone</span><input id="k-tel" inputmode="tel" value="${esc(ex?ex.tel:"")}"></label><label class="fld"><span class="lbl">E-mail</span><input id="k-email" type="email" value="${esc(ex?ex.email:"")}"></label></div>
    <label class="fld"><span class="lbl">Desconto permanente</span><select id="k-desc"><option value="">Sem desconto</option><option value="familia" ${cliDesc(ex)==="familia"?"selected":""}>Família (${nf0.format(descRates().familia*100)} %)</option><option value="first" ${cliDesc(ex)==="first"?"selected":""}>First customer (${nf0.format(descRates().first*100)} %)</option></select></label>
    <p class="note">O desconto é aplicado automaticamente em cada serviço novo deste cliente. Pode alterá-lo no próprio serviço.</p>
    <p class="note">O e-mail dá acesso à área de cliente: o cliente entra com esse endereço e vê apenas o seu histórico.</p>`;
  openSheet(ex?"Editar cliente":"Novo cliente", body, `${delBtn(!!ex)}<span class="sp"></span><button class="btn" type="button" id="sh-cancel">Cancelar</button><button class="btn pri" type="button" id="sh-save">Guardar</button>`, close=>{
    $("#sh-cancel").onclick=close;
    wireDelete(async()=>{ close(); try { await delItem("clientes",id); toast("Cliente apagado."); } catch(e){ writeErr(e); } });
    $("#sh-save").onclick=async()=>{ const nome=$("#k-nome").value.trim(); if (!nome){ toast("Indique o nome."); return; }
      const rec=Object.assign({},ex?clean(ex):{},{cod:parseInt($("#k-cod").value,10)||cod,nome,nif:$("#k-nif").value.trim(),tel:$("#k-tel").value.trim(),email:$("#k-email").value.trim(),descTipo:$("#k-desc").value,familia:$("#k-desc").value==="familia"});
      const rid=id||newId("k"); close(); try { await putItem("clientes",rid,rec); queuePortal(nome); toast(ex?"Cliente atualizado.":"Cliente criado."); } catch(e){ writeErr(e); } };
  });
}

/* ---------- compra ---------- */
function editCompra(id){
  const ex=id?S.compras[id]:null; let fotos=[...((ex&&ex.fotos)||[])];
  const phHtml=()=>fotos.map((p,i)=>`<figure>${photoImg(p,"Documento "+(i+1))}<button type="button" class="del" data-pdel="${i}" aria-label="Remover">×</button></figure>`).join("")+(assets?`<label>+ Fatura<input type="file" id="c-photo" accept="image/*" hidden></label>`:"");
  const body=`<div class="two"><label class="fld"><span class="lbl">Data</span><input type="date" id="c-d" value="${esc(ex?ex.d:today())}"></label><label class="fld"><span class="lbl">Montante €</span><input id="c-val" inputmode="decimal" value="${ex?fmtIn(ex.val):""}" placeholder="0,00"></label></div>
    <label class="fld"><span class="lbl">Loja / fornecedor</span><input id="c-loja" list="dl-loja" value="${esc(ex?ex.loja:"")}" autocomplete="off"></label>${dlist("dl-loja",list("compras").map(c=>c.loja))}
    <div class="fld"><span class="lbl">Tipo</span><div class="st" id="c-tipo">${TIPOS_COMPRA.map(t=>`<button type="button" data-t="${t[0]}" aria-pressed="${(ex&&ex.tipo||"consumivel")===t[0]}" style="font-size:13px">${t[1]}</button>`).join("")}</div></div>
    <label class="fld"><span class="lbl">Nota</span><input id="c-nota" value="${esc(ex&&ex.nota||"")}" placeholder="Produtos, n.º da fatura…"></label>
    <div class="fld"><span class="lbl">Fotografia da fatura</span><div class="photos" id="c-ph">${phHtml()}</div></div>
    ${ex?"":`<label class="chk"><input type="checkbox" id="c-bank" checked> Lançar no banco como “Compras”</label>`}`;
  openSheet(ex?"Compra":"Nova compra", body, `${delBtn(!!ex)}<span class="sp"></span><button class="btn" type="button" id="sh-cancel">Cancelar</button><button class="btn pri" type="button" id="sh-save">Guardar</button>`, close=>{
    let tipo=(ex&&ex.tipo)||"consumivel";
    $("#c-tipo").onclick=e=>{ const b=e.target.closest("[data-t]"); if(!b) return; tipo=b.dataset.t; $("#c-tipo").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.t===tipo)); };
    const ph=$("#c-ph");
    ph.addEventListener("click",e=>{ const b=e.target.closest("[data-pdel]"); if(!b) return; const [p]=fotos.splice(+b.dataset.pdel,1); ph.innerHTML=phHtml(); if (assets&&p&&p.id) assets.delete(p.id).catch(()=>{}); });
    ph.addEventListener("change",async e=>{ if (e.target.id!=="c-photo"||!assets) return; const file=e.target.files[0]; if (!file) return; try { window.__photoFolder="compras"; const r=await assets.upload(await shrink(file),{type:"image/jpeg"}); fotos.push({id:r.id,url:r.url}); ph.innerHTML=phHtml(); } catch(err){ toast("A fotografia não foi carregada."); } });
    $("#sh-cancel").onclick=close;
    wireDelete(async()=>{ close(); try { await delItem("compras",id); toast("Compra apagada."); } catch(e){ writeErr(e); } });
    $("#sh-save").onclick=async()=>{ const d=$("#c-d").value, val=r2(numIn($("#c-val").value)), loja=$("#c-loja").value.trim(), nota=$("#c-nota").value.trim();
      if (!d||!val||!loja){ toast("Preencha data, montante e loja."); return; }
      const bank=!ex&&$("#c-bank").checked, rid=id||newId("c"); close();
      try { await putItem("compras",rid,Object.assign({},ex?clean(ex):{},{d,loja,val,nota,tipo,fotos}));
        if (bank) await putItem("movimentos",newId("b"),{d,desc:"Compras",val:-val,conta:"Principal",ord:Date.now(),ref:rid});
        toast(ex?"Compra atualizada.":"Compra registada."); } catch(e){ writeErr(e); } };
  });
}

/* ---------- movimento ---------- */
function editMov(id){
  const ex=id?S.movimentos[id]:null, neg=ex?ex.val<0:false;
  const body=`<div class="fld"><span class="lbl">Tipo</span><div class="st" id="m-sig" style="grid-template-columns:1fr 1fr"><button type="button" data-s="1" aria-pressed="${!neg}">Entrada</button><button type="button" data-s="-1" aria-pressed="${neg}">Saída</button></div></div>
    <div class="two"><label class="fld"><span class="lbl">Data</span><input type="date" id="m-d" value="${esc(ex?ex.d:today())}"></label><label class="fld"><span class="lbl">Montante €</span><input id="m-val" inputmode="decimal" value="${ex?fmtIn(Math.abs(ex.val)):""}"></label></div>
    <label class="fld"><span class="lbl">Descrição</span><input id="m-desc" list="dl-mov" value="${esc(ex?ex.desc:"")}" autocomplete="off"></label>${dlist("dl-mov",[...MOV_DESC,...list("movimentos").map(m=>m.desc)])}
    <label class="fld"><span class="lbl">Conta</span><select id="m-conta">${["Principal","Avença"].map(c=>`<option ${((ex&&ex.conta)||ui.conta)===c?"selected":""}>${c}</option>`).join("")}</select></label>`;
  openSheet(ex?"Movimento":"Novo movimento", body, `${delBtn(!!ex)}<span class="sp"></span><button class="btn" type="button" id="sh-cancel">Cancelar</button><button class="btn pri" type="button" id="sh-save">Guardar</button>`, close=>{
    let sig=neg?-1:1; $("#m-sig").onclick=e=>{ const b=e.target.closest("[data-s]"); if(!b) return; sig=+b.dataset.s; $("#m-sig").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); };
    $("#sh-cancel").onclick=close;
    wireDelete(async()=>{ close(); try { await delItem("movimentos",id); toast("Movimento apagado."); } catch(e){ writeErr(e); } });
    $("#sh-save").onclick=async()=>{ const d=$("#m-d").value, v=r2(Math.abs(numIn($("#m-val").value))), desc=$("#m-desc").value.trim(), conta=$("#m-conta").value;
      if (!d||!v||!desc){ toast("Preencha data, montante e descrição."); return; }
      const rid=id||newId("b"); close(); try { await putItem("movimentos",rid,Object.assign({},ex?clean(ex):{ord:Date.now()},{d,desc,val:sig*v,conta})); toast("Movimento guardado."); } catch(e){ writeErr(e); } };
  });
}

/* ---------- stock: contar / novo produto ---------- */
function countStock(pid){
  const p=CU().produtos[pid], e=stockEstimate(pid);
  const body=`<p style="margin:0;font-weight:600">${esc(p.nome)}</p><p class="note" style="margin:0">${esc(p.generico||"")}</p>
    <div class="two"><label class="fld"><span class="lbl">Unidades que tem agora</span><input id="s-u" inputmode="decimal" value="${e?fmtIn(r2(e.left)):""}" placeholder="Ex.: 1,5"></label>
    <label class="fld"><span class="lbl">Avisar abaixo de</span><input id="s-min" inputmode="decimal" value="${fmtIn(p.minimo||1)}"></label></div>
    <p class="note">Pode usar frações: meio frasco = 0,5. A partir daqui, cada serviço entregue desconta o consumo previsto.</p>`;
  openSheet("Contagem de stock", body, `<span class="sp"></span><button class="btn" type="button" id="sh-cancel">Cancelar</button><button class="btn pri" type="button" id="sh-save">Guardar</button>`, close=>{
    $("#sh-cancel").onclick=close;
    $("#sh-save").onclick=async()=>{ const u=numIn($("#s-u").value), mn=numIn($("#s-min").value)||1; close();
      try { await patchCustos({produtos:{[pid]:{contagem:{unidades:u,data:today()},minimo:mn}}}); toast("Stock atualizado."); } catch(e){ writeErr(e); } };
  });
}
async function plusStock(pid){ const e=stockEstimate(pid); try { await patchCustos({produtos:{[pid]:{contagem:{unidades:r2((e?e.left:0)+1),data:today()}}}}); toast("Mais uma unidade registada."); } catch(e2){ writeErr(e2); } }
function newProduto(){
  const gens=[...new Set(Object.values(CU().produtos||{}).map(p=>p.generico).filter(Boolean))];
  const body=`<label class="fld"><span class="lbl">Produto (marca e embalagem)</span><input id="n-nome" placeholder="Ex.: Gyeon Bathe 1 L"></label>
    <div class="two"><label class="fld"><span class="lbl">Tipo genérico</span><input id="n-gen" list="dl-gen" placeholder="Ex.: Shampoo"></label><label class="fld"><span class="lbl">Grupo</span><select id="n-grp">${GRUPOS.map(g=>`<option>${g}</option>`).join("")}</select></label></div>${dlist("dl-gen",gens)}
    <div class="two"><label class="fld"><span class="lbl">Preço €</span><input id="n-preco" inputmode="decimal"></label><label class="fld"><span class="lbl">Dá para quantos carros</span><input id="n-usos" inputmode="decimal"></label></div>
    <label class="fld"><span class="lbl">Unidades em stock</span><input id="n-un" inputmode="decimal" placeholder="Opcional"></label>
    <p class="note">Para usar o produto num serviço, associe o tipo genérico no separador Custos.</p>`;
  openSheet("Novo produto", body, `<span class="sp"></span><button class="btn" type="button" id="sh-cancel">Cancelar</button><button class="btn pri" type="button" id="sh-save">Guardar</button>`, close=>{
    $("#sh-cancel").onclick=close;
    $("#sh-save").onclick=async()=>{ const nome=$("#n-nome").value.trim(); if (!nome){ toast("Indique o produto."); return; }
      const p={nome,generico:$("#n-gen").value.trim()||nome,grupo:$("#n-grp").value,preco:r2(numIn($("#n-preco").value)),usos:numIn($("#n-usos").value)||1,emUso:true};
      const u=$("#n-un").value.trim(); if (u) p.contagem={unidades:numIn(u),data:today()};
      close(); try { await patchCustos({produtos:{[newId("p")]:p}}); toast("Produto acrescentado."); } catch(e){ writeErr(e); } };
  });
}

/* ============ eventos ============ */
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-tab]"); if (t && !t.closest(".sheet")){ goto(t.dataset.tab); return; }
});
$("#yr").onchange=e=>{ ui.year=e.target.value; try{localStorage.setItem("cw2.year",ui.year);}catch(x){} render(); };
$("#fab").onclick=()=>{ const t=ui.tab; if (t==="compras") editCompra(); else if (t==="banco") editMov(); else if (t==="clientes") editCliente(); else editServico(null,{estado:t==="servicos"?"entregue":"agendado"}); };
const main=$("#main");
main.addEventListener("input",e=>{ if (e.target.id==="q"){ ui.q=e.target.value; render(); } });
main.addEventListener("change",e=>{
  const t=e.target;
  if (t.dataset.yr!=null){ ui.year=t.value; try{localStorage.setItem("cw2.year",ui.year);}catch(x){} render(); return; }
  if (ui.tab==="custos") cuChange(t);
  if (ui.tab==="produtos" && t.dataset.uso){ patchCustos({produtos:{[t.dataset.uso]:{emUso:t.checked}}}).then(()=>toast(t.checked?"Em uso.":"Retirado de uso."),writeErr); }
});
main.addEventListener("click", async e=>{
  const g=e.target.closest("[data-go]"); if (g){ goto(g.dataset.go); return; }
  const ed=e.target.closest("[data-edit]"); if (ed){ if (readOnly||online===false) return; const [c,id]=ed.dataset.edit.split(":"); ({servicos:editServico,compras:editCompra,movimentos:editMov})[c](id); return; }
  const cl=e.target.closest("[data-cli]"); if (cl){ openCliente(cl.dataset.cli); return; }
  const st=e.target.closest("[data-state]"); if (st){ const [id,s]=st.dataset.state.split(":"); setEstado(id,s); return; }
  const ic=e.target.closest("[data-ics]"); if (ic){ const r=S.servicos[ic.dataset.ics]; save(`agendamento-${(r.cli||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-")}-${r.d}.ics`, ics([r])); return; }
  if (e.target.closest("[data-icsall]")){ exportar("agenda"); return; }
  const em=e.target.closest("[data-emit]"); if (em){ emitFatura(em.dataset.emit); return; }
  const pok=e.target.closest("[data-ped-ok]"); if (pok){ aceitarPedido(pok.dataset.pedOk); return; }
  const pno=e.target.closest("[data-ped-no]"); if (pno){ recusarPedido(pno.dataset.pedNo); return; }
  const dsp=e.target.closest("[data-disp]"); if (dsp){ editDisponibilidade(); return; }
  const cp=e.target.closest("[data-copy]"); if (cp){ copyFatura(cp.dataset.copy); return; }
  const cn=e.target.closest("[data-conta]"); if (cn){ ui.conta=cn.dataset.conta; render(); return; }
  const ct=e.target.closest("[data-ctipo]"); if (ct){ ui.ctipo=ct.dataset.ctipo; render(); return; }
  const ex=e.target.closest("[data-export]"); if (ex){ exportar(ex.dataset.export); return; }
  const cnt=e.target.closest("[data-count]"); if (cnt){ countStock(cnt.dataset.count); return; }
  const pl=e.target.closest("[data-plus]"); if (pl){ plusStock(pl.dataset.plus); return; }
  if (e.target.closest("[data-newprod]")){ newProduto(); return; }
  if (e.target.closest("[data-portal]")){ syncAllPortal(); return; }
  const t=e.target;
  if (t.id==="save-precos"){
    const cfg=JSON.parse(JSON.stringify(S.cfg||{precos:{}})); cfg.precos=cfg.precos||{};
    for (const c of CATS){ cfg.precos[c]=cfg.precos[c]||{}; for (const s of SV){ const v=$(`#p-${c}-${s.k}`).value.trim(); cfg.precos[c][s.k]=v===""?0:numIn(v); } }
    cfg.atualizado=today(); try { await enqueue(()=>db.doc("config/precos").set(cfg)); toast("Tabela de preços guardada."); } catch(err){ writeErr(err); } return;
  }
  const rd=t.closest("[data-rdel]"); if (rd){ const d=getDraft(), [k,i]=rd.dataset.rdel.split(":"); d.receitas[k].produtos.splice(+i,1); draftDirty=true; render(); return; }
  if (t.id==="cu-reset"){ draftDirty=false; draftCu=null; render(); return; }
  if (t.id==="cu-save"){ const d=getDraft(); d.atualizado=today(); try { await enqueue(()=>db.doc("config/custos").set(JSON.parse(JSON.stringify(d)))); draftDirty=false; draftCu=null; toast("Custos guardados."); render(); } catch(err){ writeErr(err); } return; }
  if (t.id==="cu-apply"){
    if (!t.classList.contains("sure")){ t.classList.add("sure","dng"); t.textContent="Confirmar: substituir a tabela de preços"; setTimeout(()=>{ if (t.isConnected){ t.classList.remove("sure","dng"); t.textContent="Aplicar preços sugeridos à tabela"; } },5000); return; }
    getDraft(); const cfg=JSON.parse(JSON.stringify(S.cfg||{precos:{}})); cfg.precos=cfg.precos||{};
    for (const c of CATS){ cfg.precos[c]=cfg.precos[c]||{}; for (const s of SV){ if (c==="M"&&!(+cfg.precos[c][s.k])&&s.k!=="ext") continue; cfg.precos[c][s.k]=withDraft(()=>suggested(s.k,c)); } }
    cfg.atualizado=today(); try { await enqueue(()=>db.doc("config/precos").set(cfg)); toast("Tabela de preços atualizada."); } catch(err){ writeErr(err); }
  }
});
document.addEventListener("keydown",e=>{ if (e.key==="Escape"&&sheetClose) sheetClose(); });
window.addEventListener("resize",()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(()=>{ if (ui.tab==="resumo") render(); },200); });

if (document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
</script>


</body>
