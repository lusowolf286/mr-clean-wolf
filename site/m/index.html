<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E2124">
<title>A sua marcação · Mr Clean Wolf</title>
<link rel="icon" href="/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Página da marcação enviada ao cliente por SMS: os dados vêm no próprio link (#…), nada é guardado nem pedido ao servidor. */
:root{--bg:#1E2124;--surface:#282B2F;--line:#3C4046;--ink:#F3ECE3;--body:#C9C0B6;--muted:#A99F94;--gold:#E9AC3C;--ruby:#6B0F1F;
  --display:"Syne",system-ui,sans-serif;--text:"Manrope",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--body);font:16px/1.5 var(--text);-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;color:var(--ink);text-decoration:none}
.brand img{width:44px;height:44px}
.brand b{font:800 18px/1.1 var(--display);letter-spacing:.02em}
.eyebrow{margin:0 0 6px;color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0 0 20px;color:var(--ink);font:800 clamp(26px,7vw,32px)/1.15 var(--display)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px}
.row{display:grid;gap:2px}
.row span{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.row b{color:var(--ink);font-size:18px;font-weight:700}
.row.big b{font-size:22px}
.acts{display:grid;gap:12px;margin-top:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 18px;border-radius:14px;font:700 16px var(--text);text-decoration:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);width:100%}
.btn.pri{background:var(--ruby);border-color:#8A1A2D;color:var(--ink)}
.btn svg{width:20px;height:20px;flex:none}
.note{margin:18px 0 0;color:var(--muted);font-size:14px}
.note a{color:var(--gold)}
.err{border-left:4px solid var(--gold)}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img src="/img/wolf.png" alt=""><b>MR CLEAN<br>WOLF</b></a>
  <div id="app" aria-live="polite"></div>
  <p class="note">Alguma dúvida ou precisa de alterar a marcação? Escreva-nos para <a href="mailto:mrcleanwolfservices@gmail.com">mrcleanwolfservices@gmail.com</a>.</p>
</main>
<script>
(function(){
  const $app = document.getElementById("app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const pad = n => String(n).padStart(2, "0");
  function fail(){
    // E3.5: mensagem em linguagem corrente, com a forma de resolver.
    $app.innerHTML = '<p class="eyebrow">Marcação</p><h1>Não foi possível ler este link</h1><div class="card err"><p style="margin:0">O link pode ter ficado incompleto ao ser copiado. Abra-o de novo a partir da mensagem que recebeu ou contacte-nos.</p></div>';
  }
  let m;
  try {
    const raw = decodeURIComponent(location.hash.slice(1)).replace(/-/g, "+").replace(/_/g, "/");
    m = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(m.d) || !/^\d{2}:\d{2}$/.test(m.h)) throw 0;
  } catch(e){ fail(); return; }

  const [Y, M, D] = m.d.split("-").map(Number), [hh, mm] = m.h.split(":").map(Number);
  const start = new Date(Y, M - 1, D, hh, mm), mins = Math.max(30, +m.m || 60), end = new Date(start.getTime() + mins * 60000);
  if (isNaN(start)) { fail(); return; }
  const dia = start.toLocaleDateString("pt-PT", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
  const hora = `${pad(hh)}:${pad(mm)} – ${pad(end.getHours())}:${pad(end.getMinutes())}`;
  const titulo = "Mr Clean Wolf — " + (m.s ? m.s : "Marcação");
  const notas = [m.s && "Serviços: " + m.s, m.v && "Viatura: " + m.v, "Contacto: mrcleanwolfservices@gmail.com"].filter(Boolean).join("\n");
  const stamp = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

  $app.innerHTML = `<p class="eyebrow">Marcação confirmada</p><h1>Até breve!</h1>
    <div class="card">
      <div class="row big"><span>Data</span><b>${esc(dia.charAt(0).toUpperCase() + dia.slice(1))}</b></div>
      <div class="row"><span>Hora</span><b>${esc(hora)}</b></div>
      ${m.s ? `<div class="row"><span>Serviços</span><b>${esc(m.s)}</b></div>` : ""}
      ${m.v ? `<div class="row"><span>Viatura</span><b>${esc(m.v)}</b></div>` : ""}
    </div>
    <div class="acts">
      <button class="btn pri" type="button" id="ics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>Adicionar ao calendário</button>
      <a class="btn" id="gcal" target="_blank" rel="noopener">Adicionar ao Google Calendar</a>
    </div>`;

  // R2.1/R5.1: uma só ação principal (calendário do telemóvel); o Google Calendar fica como alternativa em contorno.
  const e = s => String(s).replace(/\\/g, "\\\\").replace(/[,;]/g, x => "\\" + x).replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mr Clean Wolf//Marcacao//PT","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT","UID:" + (m.i || stamp(start)) + "@cliente.mrcleanwolf","DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, ""),
    "DTSTART:" + stamp(start),"DTEND:" + stamp(end),"SUMMARY:" + e(titulo),"DESCRIPTION:" + e(notas),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + e(titulo),"TRIGGER:-P1D","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  document.getElementById("ics").onclick = () => {
    const blob = new Blob([ics], { type:"text/calendar;charset=utf-8" }), url = URL.createObjectURL(blob);
    const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (iOS) { location.href = url; return; }     // o Safari mostra «Adicionar ao Calendário»
    const a = document.createElement("a"); a.href = url; a.download = "marcacao-mr-clean-wolf.ics"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  };
  document.getElementById("gcal").href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(titulo) + "&dates=" + stamp(start) + "/" + stamp(end)
    + "&ctz=Atlantic/Azores&details=" + encodeURIComponent(notas);
})();
</script>
</body>
</html>
